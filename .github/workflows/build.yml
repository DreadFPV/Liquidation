name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            config: -A x64
          - name: macOS
            os: macos-latest
            config: -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Linux
            os: ubuntu-24.04
            config: -G Ninja -DCMAKE_BUILD_TYPE=Release

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Configure
        shell: bash
        run: cmake -S . -B build ${{ matrix.config }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: DSP tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: pluginval (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          unzip -o pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 5 --validate-in-process --skip-gui-tests \
            "build/Liquidation_artefacts/Release/VST3/Liquidation.vst3"

      - name: Collect artefacts
        shell: bash
        run: |
          mkdir -p dist
          ART=build/Liquidation_artefacts/Release
          cp -R "$ART/VST3/Liquidation.vst3" dist/
          if [ -d "$ART/AU/Liquidation.component" ]; then cp -R "$ART/AU/Liquidation.component" dist/; fi
          if [ -f "$ART/Standalone/Liquidation.exe" ]; then cp "$ART/Standalone/Liquidation.exe" dist/; fi
          if [ -d "$ART/Standalone/Liquidation.app" ]; then cp -R "$ART/Standalone/Liquidation.app" dist/; fi
          cp README.md dist/

      - name: Sign and package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          # ad-hoc signature so macOS / Cubase accept the bundles after xattr -cr
          for b in Liquidation.vst3 Liquidation.component Liquidation.app; do
            [ -e "$b" ] && codesign --force --deep --sign - "$b" && codesign --verify --deep --strict "$b"
          done
          # ditto keeps executable bits and symlinks (upload-artifact would strip them)
          ditto -c -k --keepParent Liquidation.vst3 Liquidation-VST3-mac.zip
          ditto -c -k --keepParent Liquidation.component Liquidation-AU-mac.zip
          ditto -c -k --keepParent Liquidation.app Liquidation-App-mac.zip
          rm -rf Liquidation.vst3 Liquidation.component Liquidation.app

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Liquidation-${{ matrix.name }}
          path: dist
